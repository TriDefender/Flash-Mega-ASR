[project]
name = "flash-mega-asr"
version = "0.1.2"
description = "Flash-attention optimized Mega-ASR: fast batched inference with LoRA routing for robust speech recognition"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Flash-Mega-ASR Contributors" },
]

dependencies = [
    "qwen-asr>=0.0.6",
    "torch>=2.10",
    "torchaudio>=2.10",
    "safetensors",
    "soundfile",
    "scipy",
    "huggingface_hub",
    "peft",
    "rich>=13.0",
    "triton-windows>=3.0; sys_platform == 'win32'",
    "triton>=3.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
flash-attn = [
    "flash-attn>=2.0; sys_platform != 'win32'",
]
webui = [
    "streamlit",
    "streamlit-mic-recorder",
    "matplotlib",
]
eval = [
    "editdistance",
    "sacrebleu",
    "whisper-normalizer",
    "zhconv",
    "tqdm",
    "datasets",
]
dev = [
    "pytest",
    "ruff",
]
all = [
    "flash-mega-asr[flash-attn,webui,eval,dev]",
]

[project.scripts]
flash-mega-asr = "MegaASR.cli:main"

[build-system]
requires = ["hatchling", "torch>=2.10"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/MegaASR"]

[project.urls]
Repository = "https://github.com/TriDefender/Flash-Mega-ASR"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
